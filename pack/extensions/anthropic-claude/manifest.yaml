id: anthropic-claude
name: Anthropic / Claude Editorial Workbench
version: 0.5.0
status: draft
category: ai_workbench
summary: >
  Warm paper editorialism plus disciplined AI workbench: calm document-like hierarchy,
  compact workbench controls, sparse artifact surfaces, low-contrast trust, black/ivory utility,
  and restrained clay/terracotta accents.

best_for:
  - AI workspaces
  - scientific notes
  - calm explainers
  - document-like product flows
  - artifact/code/file panels
  - editorial product landing pages

avoid_for:
  - neon SaaS dashboards
  - aggressive consumer funnels
  - playful gaming aesthetics
  - dense admin panels without editorial hierarchy
  - glossy 3D AI cliché visuals

runtime_contract:
  external_tools_allowed: false
  canonical_prompts: false
  agent_uses_repo_only: true

