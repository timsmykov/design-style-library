  mobbin_local_assets: 93
  source_mapped_assets: 93
  screenshot_fact_assets: 93
  public_code_pages: 2
  public_css_files: 0
  browser_cdp_targets: 4
  evidence_level: partial
  notes:
    - 93 Mobbin local refs saved: 45 screens, 44 flow screens, 4 sections.
    - Public no-login page attempts saved for homepage and Pro page; both currently returned Cloudflare security verification in Chromium/Firecrawl, so DOM/CSS evidence is access-limited.
    - Authenticated/library/search-new surfaces and Cloudflare-gated public extraction are recorded as blockers; no credentials/OAuth submitted.
