id: no-login-batch-01
name: Ten no-login style packs after Anthropic
mode: no_login
source_of_truth: git_repo
semantic_index: gbrain
status: planned
shared_acceptance:
  - local Mobbin refs saved under evidence/mobbin
  - source map covers 100 percent of local refs
  - screenshot facts grouped by component
  - public DOM/CSS/CDP evidence captured where possible
  - component capsules and component-index generated
  - Gbrain slices synced from repo export
  - stylepack verifier passes
  - authenticated gaps recorded explicitly
targets:
  - id: perplexity-answer-engine
    name: Perplexity Answer Engine
    category: answer_search_engine
    public_urls:
      - https://www.perplexity.ai/
      - https://www.perplexity.ai/pro
    mobbin_queries:
      screens: Perplexity answer search citations sources follow-up threads collections settings web app
      sections: Perplexity AI search answer engine landing pricing product cards citations trust
      flows: Perplexity onboarding signup upgrade pro search answer citation follow-up
  - id: notion-document-os
    name: Notion Document OS
    category: document_os
    public_urls:
      - https://www.notion.com/
      - https://www.notion.com/pricing
    mobbin_queries:
      screens: Notion web app document editor database sidebar blocks settings templates workspace
      sections: Notion website product docs wiki projects pricing templates AI sections
      flows: Notion onboarding create workspace invite team templates upgrade settings
  - id: linear-operational-workspace
